<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menna's Very Serious Relationship Test 💗</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,#ffe1ec,#f8b8d0 55%,#e9a9ce);color:#54263e;overflow:hidden}.card{width:min(520px,100%);background:#fffafc;border:2px solid #fff;border-radius:30px;padding:34px 26px;text-align:center;box-shadow:0 22px 60px #9c416344;position:relative}.tag{display:inline-block;background:#ffe3ed;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:800;letter-spacing:1px;color:#b04472}.emoji{font-size:58px;margin:18px 0 4px}h1{font-size:clamp(27px,6vw,38px);line-height:1.12;margin:12px 0;color:#8d315c}p{color:#80536a;line-height:1.6;margin:12px auto 22px;max-width:390px}.buttons{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:54px}.btn{border:0;border-radius:999px;padding:13px 25px;font-size:16px;font-weight:800;cursor:pointer;transition:.2s}.yes{background:#e94f91;color:white;box-shadow:0 7px 0 #bd3470}.no{background:#f3e7ed;color:#7b5367}.fine{font-size:12px;margin-top:25px;opacity:.65}.hidden{display:none}.result{font-size:18px;font-weight:700;color:#a12f67}.heart{position:fixed;bottom:-30px;animation:float 5s linear infinite;opacity:.7;pointer-events:none}@keyframes float{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}.small{font-size:13px}.meme-photo{display:block;width:min(100%,320px);height:auto;margin:18px auto 12px;border-radius:18px;border:4px solid #ffe3ed;box-shadow:0 10px 24px #9c416322}
</style></head>
<body>
<main class="card" id="main">
 <span class="tag">⚠️ OFFICIAL RELATIONSHIP TEST</span>
 <div class="emoji">🕵️‍♀️💗</div>
 <h1>Menna, we need to talk...</h1>
 <p>Menna, you've been specially selected for a very important relationship investigation. Please answer honestly. There are absolutely no consequences. (Probably.)</p>
 <button class="btn yes" onclick="startTest()">Start investigation</button>
 <div class="fine">Department of Overthinking & Cute Stuff · Est. whenever we met</div>
</main>
<script>
function startTest(){document.getElementById('main').innerHTML=`<span class="tag">QUESTION 01 OF 01</span><div class="emoji">🥺</div><h1>Menna, do you love me?</h1><p>Choose carefully. Our highly advanced system is watching.</p><div class="buttons"><button class="btn yes" onclick="accepted()">YES, obviously 💗</button><button class="btn no" id="no" onmouseover="runAway()" onclick="runAway()">No 🙄</button></div><div class="fine">Your answer will be reviewed by the cuddles committee.</div>`}
function runAway(){const b=document.getElementById('no');if(!b)return;b.style.position='relative';b.style.transform=`translate(${Math.random()*150-75}px,${Math.random()*90-45}px)`;}
function accepted(){document.getElementById('main').innerHTML=`<div class="emoji">🥳💞</div><h1>CASE CLOSED!</h1><p class="result">Menna, correct answer! You have officially been sentenced to unlimited hugs, kisses, and putting up with me forever. 😂</p><p>i know kda kda ❤️</p><img class="meme-photo" src="WhatsApp%20Image%202026-11-19%20at%203.31.59%20PM.jpeg" alt="Menna" loading="lazy"><div class="fine">Special guest appearance 😂</div><button class="btn yes" onclick="location.reload()">Take the test again</button><div class="fine">I knew you'd choose wisely. 😌</div>`;for(let i=0;i<22;i++){let h=document.createElement('div');h.className='heart';h.textContent=['💗','💕','💖','❤️'][i%4];h.style.left=Math.random()*100+'vw';h.style.animationDelay=Math.random()*3+'s';h.style.fontSize=(18+Math.random()*22)+'px';document.body.appendChild(h)}}
</script></body></html>
